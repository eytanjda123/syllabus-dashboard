<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coursework</title>
<meta name="description" content="A personal dashboard for what's due across this semester's courses.">
<link rel="stylesheet" href="styles.css?v=15">
</head>
<body>

<div class="wrap">

  <header class="masthead">
    <h1><a href="#/">Coursework</a></h1>
    <button type="button" id="searchTrigger" class="search-trigger">Search <kbd>&#8984;K</kbd></button>
    <button type="button" id="addTrigger" class="search-trigger">+ Add</button>
    <div class="today-line" id="todayLine"></div>
  </header>

  <nav class="nav" id="nav" aria-label="Sections">
    <a href="#/" data-route="home">Due</a>
    <a href="#/courses" data-route="courses">Courses</a>
    <a href="#/reference" data-route="reference">Office hours &amp; grading</a>
    <a href="#/archive" data-route="archive">Past semesters</a>
    <a href="#/sync" data-route="sync">Sync</a>
  </nav>

  <div id="urgent" class="urgent" aria-live="polite"></div>

  <div class="search-modal" id="searchModal" hidden>
    <div class="search-panel" role="dialog" aria-modal="true" aria-label="Search">
      <input type="text" id="searchInput" class="search-input" placeholder="Search readings, assignments, courses…" autocomplete="off" spellcheck="false">
      <ul class="search-results" id="searchResults"></ul>
      <p class="search-empty" id="searchEmpty" hidden>No matches.</p>
    </div>
  </div>

  <div class="search-modal" id="addModal" hidden>
    <div class="search-panel add-panel" role="dialog" aria-modal="true" aria-label="Add an item">
      <form id="addForm">
        <h3>Add something</h3>
        <p class="add-hint">Saved on this device only — not part of the synced syllabus data.</p>
        <label class="add-field">Course
          <select id="addCourse" required></select>
        </label>
        <label class="add-field">What do you need to do?
          <input type="text" id="addTitle" required placeholder="e.g. Email professor about an extension" autocomplete="off">
        </label>
        <div class="add-row">
          <label class="add-field">Type
            <select id="addType">
              <option value="assignment">Assignment</option>
              <option value="reading">Reading</option>
              <option value="exam">Exam</option>
              <option value="project">Project</option>
              <option value="deliverable">Deliverable</option>
              <option value="other">Other</option>
            </select>
          </label>
          <label class="add-field">Date
            <input type="date" id="addDate" required>
          </label>
          <label class="add-field">Time (optional)
            <input type="time" id="addTime">
          </label>
        </div>
        <div class="add-actions">
          <button type="submit" class="btn">Add</button>
          <button type="button" class="btn" id="addCancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <main id="view">
    <p class="empty">Loading your courses&hellip;</p>
  </main>

  <p class="footnote" id="footnote"></p>

</div>

<script src="app.js?v=15"></script>
</body>
</html>
